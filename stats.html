<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link WISP Fresnel — Estadísticas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Karla:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#f5f9ff; --surface:#ffffff; --ink:#0b2447; --ink-soft:#4a6488; --line:#dbe6f6;
    --blue:#175cd3; --blue-deep:#0b3d8a; --good:#0f9d58; --shadow:0 20px 50px -28px rgba(11,36,71,0.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#060c1a; --surface:#0d1a33; --ink:#eaf1ff; --ink-soft:#9db2d6; --line:#1c2c4d;
      --blue:#4d8dff; --blue-deep:#2e6ae0; --good:#34d399; --shadow:0 20px 50px -20px rgba(0,0,0,0.6);
    }
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Karla',system-ui,sans-serif; }
  .wrap{ max-width:760px; margin:0 auto; padding:48px 24px 64px; }
  h1{ font-family:'Sora',sans-serif; font-size:1.6rem; font-weight:800; margin:0 0 6px; }
  .sub{ color:var(--ink-soft); margin:0 0 32px; font-size:0.95rem; }
  .tiles{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; margin-bottom:32px; }
  .tile{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
  .tile .label{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-soft); font-family:'Sora',sans-serif; font-weight:600; }
  .tile .value{ font-family:'JetBrains Mono',monospace; font-size:2.2rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; margin-top:6px; }
  .tile.accent .value{ color:var(--blue-deep); }
  .tile.good .value{ color:var(--good); }
  .foot{ color:var(--ink-soft); font-size:0.8rem; margin-top:8px; }
  button{
    font-family:'Sora',sans-serif; font-weight:600; font-size:0.85rem; color:#fff;
    background:var(--blue); border:none; border-radius:10px; padding:10px 16px; cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Link WISP Fresnel — Estadísticas</h1>
  <p class="sub">Esta página no está enlazada desde ningún lado público — solo tú tienes este link.</p>

  <div class="tiles">
    <div class="tile accent">
      <div class="label">Visitas a la página</div>
      <div class="value" id="visits">—</div>
    </div>
    <div class="tile good">
      <div class="label">Descargas del APK</div>
      <div class="value" id="downloads">—</div>
    </div>
    <div class="tile">
      <div class="label">Conversión</div>
      <div class="value" id="conversion">—</div>
    </div>
  </div>

  <button id="refresh">Actualizar</button>
  <p class="foot" id="status">Cargando…</p>
</div>

<script>
  (function () {
    var NS = "link-wisp-fresnel-lwf2026";
    var statusEl = document.getElementById("status");

    function load() {
      statusEl.textContent = "Cargando…";
      Promise.all([
        fetch("https://abacus.jasoncameron.dev/get/" + NS + "/visits").then(function (r) { return r.json(); }).catch(function () { return { value: 0 }; }),
        fetch("https://abacus.jasoncameron.dev/get/" + NS + "/downloads").then(function (r) { return r.json(); }).catch(function () { return { value: 0 }; })
      ]).then(function (results) {
        var visits = results[0].value || 0;
        var downloads = results[1].value || 0;
        document.getElementById("visits").textContent = visits;
        document.getElementById("downloads").textContent = downloads;
        document.getElementById("conversion").textContent = visits > 0 ? Math.round((downloads / visits) * 100) + "%" : "—";
        statusEl.textContent = "Actualizado: " + new Date().toLocaleString("es-MX");
      });
    }

    document.getElementById("refresh").addEventListener("click", load);
    load();
  })();
</script>
</body>
</html>
